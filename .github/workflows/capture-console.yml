name: Capture Browser Console

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/capture-console.js'
      - '.github/workflows/capture-console.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # puppeteer-core@25 requires Node >=22.12. --ignore-scripts skips native builds
        # (re2/protobufjs, pulled in by firebase-tools) that this job does not need.
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run capture script
        run: node scripts/capture-console.js https://home-made-recipe-c857f.web.app > console-output.txt 2>&1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-logs
          path: console-output.txt
